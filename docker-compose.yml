version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: agripredic
      MYSQL_USER: ${MYSQL_USER:-agripredic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agripredic_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: mysql+pymysql://${MYSQL_USER:-agripredic}:${MYSQL_PASSWORD:-agripredic_pass}@db:3306/agripredic
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_long_random_string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agripredic.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  uploads_data:
